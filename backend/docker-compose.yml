version: "3.9"

services:
  # ==========================================================================
  # PostgreSQL
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-aura}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aura123}
      POSTGRES_DB: ${PG_DATABASE:-aura_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-aura} -d ${PG_DATABASE:-aura_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aura-network

  # ==========================================================================
  # Milvus (Standalone)
  # ==========================================================================
  etcd:
    container_name: aura-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aura-network

  # [已移除] Milvus 自带的 MinIO —— 对象存储改用已在 Docker 中部署的 RustFS
  # （S3 兼容，见 milvus-standalone 的 MINIO_* 环境变量）。原 9001 控制台端口
  # 也与 RustFS 冲突，故一并去除。

  milvus-standalone:
    container_name: aura-milvus
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 对象存储：使用宿主机上已部署的 RustFS（S3 兼容），经 host.docker.internal 访问
      MINIO_ADDRESS: host.docker.internal:9000
      MINIO_ACCESS_KEY_ID: rustfsadmin
      MINIO_SECRET_ACCESS_KEY: rustfsadmin
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: milvus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
    networks:
      - aura-network

  # ==========================================================================
  # Attu (Milvus 图形化管理工具)
  # 访问：http://localhost:3300  （连接地址留空或填 milvus-standalone:19530）
  # 版本对齐 Milvus 2.5.x；Attu 容器内部监听 3000，映射到宿主机 3300
  # （前端已占 3000、后端已占 8000）。
  # ==========================================================================
  attu:
    image: zilliz/attu:v2.5
    container_name: aura-milvus-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "3300:3000"
    depends_on:
      - milvus-standalone
    networks:
      - aura-network

  # ==========================================================================
  # 应用 OSS —— 已改用宿主机上部署的 RustFS（S3 兼容，端口 9000）。
  # 原 MinIO(aura-oss) 与 RustFS 争用 9000 端口且功能重复，故移除。
  # 应用通过 .env 的 OSS_ENDPOINT=http://localhost:9000 连接 RustFS。
  # ==========================================================================

