#    container_name: aura-python-service
#    restart: unless-stopped
#    environment:
#      - PG_HOST=postgres
#      - PG_PORT=5432
#      - PG_USER=${PG_USER:-aura}
#      - PG_PASSWORD=${PG_PASSWORD:-aura123}
#      - PG_DATABASE=${PG_DATABASE:-aura_ai}
#      - MILVUS_HOST=milvus-standalone
#      - MILVUS_PORT=19530
#      - OPENAI_API_KEY=${OPENAI_API_KEY}
#      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
#      - OSS_ENDPOINT=http://oss:9000
#      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-minioadmin}
#      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-minioadmin}
#      - OSS_BUCKET=${OSS_BUCKET:-aura-ai}
#      - COHERE_API_KEY=${COHERE_API_KEY}
#    ports:
#      - "8000:8000"
#    depends_on:
#      postgres:
#        condition: service_healthy
#      milvus-standalone:
#        condition: service_started
#      oss:
#        condition: service_started
#    volumes:
#      - ./python-service:/app
#    networks:
#      - aura-network

  # ==========================================================================
  # Index Worker
  # ==========================================================================
  index-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-index-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.index_worker"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-aura}
      - PG_PASSWORD=${PG_PASSWORD:-aura123}
      - PG_DATABASE=${PG_DATABASE:-aura_ai}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v4}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-3072}
      - COHERE_API_KEY=${COHERE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aura-network

  # ==========================================================================
  # [已移除] Qdrant —— Mem0 长期记忆改用系统 Milvus（collection: mem0_memories），
  # 与 document_chunks 共用同一 Milvus 实例，统一由 RustFS 承载对象存储，降低运维成本。
  # 如需回退：重新启用本服务并设 MEM0_VECTOR_STORE_PROVIDER=qdrant。
  # ==========================================================================

  # ==========================================================================
  # Redis (Optional - for caching / session)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aura-network

volumes:
  postgres_data:
  etcd_data:
  milvus_data:
  redis_data:

networks:
  aura-network:
    driver: bridge
