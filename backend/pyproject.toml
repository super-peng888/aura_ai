[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-ai-enterprise"
version = "0.1.0"
description = "Aura AI Enterprise Backend — RAG conversation, document parsing, and agent workflow."
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "python-multipart>=0.0.12,<0.1.0",
    "sse-starlette>=2.1.0,<4.0.0",

    # Database
    "asyncpg>=0.30.0,<0.32.0",
    "qdrant-client>=1.9.0",  # Mem0 向量存储（Qdrant）
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "alembic>=1.14.0,<1.15.0",

    # Vector DB
    "pymilvus>=2.5.0,<3.0.0",

    # LLM & Agent — 使用 1.x 新版本，避免 0.x 旧 API 过时
    "langchain>=1.3.0,<2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai>=1.2.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",
    "langgraph>=1.2.0,<2.0.0",
    "langchain-mcp-adapters>=0.3.0,<0.4.0",

    # RAG & Indexing
    "llama-index>=0.14.0,<0.15.0",
    "llama-index-vector-stores-milvus>=1.1.0,<2.0.0",
    "llama-index-embeddings-openai>=0.6.0,<0.7.0",
    "llama-index-postprocessor-cohere-rerank>=0.9.0,<0.10.0",

    # GraphRAG（图谱构建与遍历）
    "langextract>=1.0.0",  # LLM 结构化实体/关系抽取
    "networkx>=3.2",       # 图遍历与社区检测
    "numpy>=1.26,<2",      # 锁定 <2：numpy 2.x 导致 torch shm.dll 加载失败（Windows）

    # Document Parsing
    "pymupdf>=1.24.0,<1.28.0",
    "python-docx>=1.1.0,<1.3.0",
    "openpyxl>=3.1.0,<3.2.0",
    "paddlepaddle>=2.6.0",  # PaddleOCR 多模态文档解析
    "paddleocr>=2.7.0",

    # Image Processing
    "pillow>=10.4.0,<11.0.0",

    # OSS (RustFS，S3 兼容，使用 minio 客户端)
    "minio>=7.2.0,<8.0.0",

    # Auth
    "passlib[bcrypt]>=1.7.4,<1.8.0",
    "python-jose[cryptography]>=3.3.0,<3.6.0",

    # Encryption
    "cryptography>=43.0.0,<49.0.0",

    # Utils
    "pydantic>=2.9.0,<2.14.0",
    "pydantic-settings>=2.5.0,<2.15.0",
    "httpx>=0.27.0,<0.29.0",
    "aiofiles>=24.1.0,<26.0.0",
    "numpy>=1.26.2,<3.0.0",

    # Reranker & Sparse Embedding
    "sentence-transformers>=3.2.0,<4.0.0",
    "transformers>=4.45.0,<5.0.0",

    # Embedding（DashScope 官方 SDK，多模态向量 MultiModalEmbedding）
    "dashscope>=1.20.0",

    # Memory
    "mem0ai>=0.1.0",

    # Cache
    "redis>=5.0.0,<9.0.0",

    # Data Agent (BI)
    "sqlparse>=0.5,<0.6",
    "pandas>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
